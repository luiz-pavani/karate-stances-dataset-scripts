[project]
name = "karate-stances-pipeline"
version = "0.2.0"
description = "Processing and analysis pipeline for the karate stances biomechanical dataset (DOI 10.6084/m9.figshare.32288943)"
readme = "README.md"
authors = [
    { name = "Luiz Pavani", email = "up202401900@up.pt" },
    { name = "Johan Andrés Robalino" },
    { name = "Franciele Parolini" },
    { name = "Márcio Goethel" },
    { name = "J. Paulo Vilas-Boas" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ezc3d>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/luiz-pavani/karate-stances-dataset-scripts"
Dataset = "https://doi.org/10.6084/m9.figshare.32288943"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
